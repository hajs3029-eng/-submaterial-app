<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1769e0">
<title>부자재 관리</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f5f7fa;color:#18212f}
.app{max-width:680px;margin:auto;min-height:100vh;background:#f5f7fa;padding-bottom:86px}
header{background:#1769e0;color:#fff;padding:18px 18px 20px;position:sticky;top:0;z-index:5}
.head{display:flex;align-items:center;justify-content:space-between}.title{font-size:23px;font-weight:800}.sub{font-size:12px;opacity:.9;margin-top:3px}
.icon{border:0;background:#fff2;color:#fff;font-size:25px;width:40px;height:40px;border-radius:12px}.date{margin-top:16px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
main{padding:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 8px #0000000b}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:#667085}
h2{font-size:18px;margin:20px 2px 10px}.card{background:#fff;border-radius:14px;padding:14px;margin:9px 0;box-shadow:0 2px 8px #0000000b}.row{display:flex;justify-content:space-between;align-items:center}.name{font-weight:800}.muted{font-size:12px;color:#667085;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.metric{background:#f3f6fa;border-radius:9px;padding:8px}.metric span{display:block;font-size:10px;color:#667085}.metric b{font-size:15px}.order{color:#d83a3a;font-weight:800}.ok{color:#16834b;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:11px;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:10px 6px;border-bottom:1px solid #edf0f3;text-align:center}th{background:#eef3f9;color:#526071}
nav{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:auto;background:#fff;border-top:1px solid #e4e8ee;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10}nav button{border:0;background:none;font-size:11px;color:#657080;padding:5px}nav .active{color:#1769e0;font-weight:800}nav .plus{color:#1769e0;font-size:24px;line-height:20px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:680px;margin:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet h3{margin:0 0 15px;font-size:20px}label{font-size:12px;color:#667085;display:block;margin:12px 0 5px}input,select{width:100%;padding:13px;border:1px solid #d8dee8;border-radius:10px;font-size:16px}button.primary{width:100%;border:0;border-radius:11px;background:#1769e0;color:#fff;font-weight:800;padding:14px;margin-top:16px;font-size:16px}.close{float:right;border:0;background:#f0f2f5;border-radius:9px;padding:8px 11px}.day{border:1px solid #e1e6ed;border-radius:10px;padding:10px;margin:7px 0}
</style>
</head>
<body>
<div class="app">
<header><div class="head"><button class="icon" onclick="alert('메뉴')">☰</button><div><div class="title">부자재 관리</div><div class="sub">창고 발주 관리 시스템</div></div><button class="icon" onclick="openModal('out')">＋</button></div>
<div class="date">기준일 : <span id="today"></span><button class="icon" onclick="render()">↻</button></div></header>
<main>
<div class="stats"><div class="stat"><b id="need">0</b><span>발주 필요</span></div><div class="stat"><b id="check">0</b><span>확인 필요</span></div><div class="stat"><b id="good">0</b><span>재고 적정</span></div></div>
<h2>발주 필요 품목</h2><div id="items"></div>
<h2>최근 출고 내역</h2><div style="overflow:auto"><table><thead><tr><th>날짜</th><th>품목명</th><th>출고 수량</th><th>재고 수량</th><th>비고</th></tr></thead><tbody id="history"></tbody></table></div>
</main>
<nav><button class="active" onclick="render()">⌂<br>홈</button><button onclick="openModal('itemsModal')">▣<br>품목 관리</button><button class="plus" onclick="openModal('out')">＋<br><span style="font-size:11px">출고 등록</span></button><button onclick="openModal('cal')">▦<br>통계/기록</button></nav>
</div>

<div class="modal" id="out"><div class="sheet"><button class="close" onclick="closeAll()">닫기</button><h3>출고 등록</h3><label>날짜</label><input id="odate" type="date"><label>품목</label><select id="item"></select><label>출고 수량</label><input id="qty" type="number" min="0" step="1" inputmode="numeric" placeholder="숫자만 입력"><label>비고 (선택)</label><input id="note" maxlength="30" placeholder="예: 긴급 출고"><button class="primary" onclick="saveOut()">저장</button></div></div>
<div class="modal" id="cal"><div class="sheet"><button class="close" onclick="closeAll()">닫기</button><h3>출고 기록</h3><div id="calbody"></div></div></div>
<div class="modal" id="itemsModal"><div class="sheet"><button class="close" onclick="closeAll()">닫기</button><h3>품목 관리</h3><p class="muted">현재 등록 품목 7개</p><div id="itemlist"></div></div></div>

<script>
const items=[
["오리콘(3호)",120,380,420,600],["오리콘(4호)",80,250,310,520],["오리콘(5호)",200,300,280,450],
["테이프(미색)",150,180,200,230],["테이프(적색)",60,120,110,180],["위생백",300,250,240,150],["지퍼백",500,420,430,0]
];
let records=JSON.parse(localStorage.getItem("submaterial_records")||"[]");
const d=new Date(); const iso=x=>new Date(x).toISOString().slice(0,10);
function render(){document.getElementById("today").textContent=d.toLocaleDateString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"}).replaceAll(". ","-").replace(".","").replace(" "," ");
let need=0,check=0,good=0; const box=document.getElementById("items"); box.innerHTML="";
items.forEach((it,i)=>{let status=it[1]<it[2]*.5?"발주 필요":it[1]<it[2]?"확인 필요":"재고 적정";if(status==="발주 필요")need++;else if(status==="확인 필요")check++;else good++;
box.innerHTML+=`<div class="card"><div class="row"><div><div class="name">${it[0]}</div><div class="muted">현재 재고 ${it[1].toLocaleString()}개</div></div><div class="${status==='재고 적정'?'ok':'order'}">${status}</div></div><div class="grid"><div class="metric"><span>최근 3개월 평균</span><b>${it[2]}</b></div><div class="metric"><span>전년 동월 출고</span><b>${it[3]}</b></div><div class="metric"><span>추천 발주량</span><b>${it[4]}</b></div></div></div>`});
document.getElementById("need").textContent=need;document.getElementById("check").textContent=check;document.getElementById("good").textContent=good;
document.getElementById("history").innerHTML=records.slice().reverse().slice(0,12).map(r=>`<tr><td>${r.date}</td><td>${r.name}</td><td>${r.qty}</td><td>${r.stock}</td><td>${r.note||""}</td></tr>`).join("");
}
function openModal(id){document.querySelectorAll(".modal").forEach(x=>x.style.display="none");document.getElementById(id).style.display="flex";if(id==="out"){document.getElementById("odate").value=iso(new Date());document.getElementById("item").innerHTML=items.map((x,i)=>`<option value="${i}">${x[0]}</option>`).join("");document.getElementById("qty").value="";document.getElementById("note").value=""}if(id==="cal"){document.getElementById("calbody").innerHTML=records.length?records.slice().reverse().map(r=>`<div class="day"><b>${r.date}</b><br>${r.name} — <b>${r.qty}</b>개<br><span class="muted">재고 ${r.stock}개 ${r.note?"· "+r.note:""}</span></div>`).join(""):"<p>아직 출고 기록이 없습니다.</p>"}if(id==="itemsModal"){document.getElementById("itemlist").innerHTML=items.map((x,i)=>`<div class="card"><b>${i+1}. ${x[0]}</b><div class="muted">현재 재고 ${x[1]}개</div></div>`).join("")}}
function closeAll(){document.querySelectorAll(".modal").forEach(x=>x.style.display="none")}
function saveOut(){let i=+document.getElementById("item").value,q=parseInt(document.getElementById("qty").value,10);if(!Number.isInteger(q)||q<0){alert("출고 수량은 숫자로 입력해줘.");return}let r={date:document.getElementById("odate").value,name:items[i][0],qty:q,stock:Math.max(0,items[i][1]-q),note:document.getElementById("note").value.trim()};records.push(r);localStorage.setItem("submaterial_records",JSON.stringify(records));closeAll();render();alert("출고 내역이 저장됐어.");}
render();
</script>
</body></html>
